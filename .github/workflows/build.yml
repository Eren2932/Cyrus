      - name: Verify native dependency[span_102](start_span)[span_102](end_span)
        run: |[span_103](start_span)[span_103](end_span)
          python3 - <<'PY'
          import io, os, zipfile
          from pathlib import Path
          files = list((Path(os.environ['PROJECT_DIR']) / 'vpn/service/libs').glob('*.aar'))
          if len(files) != 1:
              raise SystemExit('Expected exactly one libbox AAR.')
          with zipfile.ZipFile(files[0]) as aar:
              with zipfile.ZipFile(io.BytesIO(aar.read('classes.jar'))) as jar:
                  if 'io/nekohasekai/libbox/Libbox.class' not in jar.namelist():
                      raise SystemExit('AAR does not contain io.nekohasekai.libbox.Libbox.')
              for abi in ('arm64-v8a', 'armeabi-v7a', 'x86_64'):
                  if f'jni/{abi}/libbox.so' not in aar.namelist():
                      raise SystemExit(f'AAR missing native library for {abi}; this project builds three ABI splits.')
          print('Native AAR contains Java bindings and all three required ABIs.')
          PY[span_104](start_span)[span_104](end_span)

