          fi
          java -version
          "$SDKMANAGER" --version
          printf 'y\n%.0s' {1..256} | "$SDKMANAGER" --sdk_root="$SDK_ROOT" --licenses
          ret=$?
          if [[ $ret -gt 1 ]]; then
            echo "::error::sdkmanager --licenses exited with $ret"
            exit $ret
          fi
          echo "ANDROID_HOME=$SDK_ROOT"             >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$SDK_ROOT"         >> "$GITHUB_ENV"
          echo "$SDK_ROOT/cmdline-tools/latest/bin" >> "$GITHUB_PATH"
